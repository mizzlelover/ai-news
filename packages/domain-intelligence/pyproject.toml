[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-intelligence-bootstrap"
version = "0.1.0"
description = "An auditable, domain-agnostic intelligence radar bootstrap engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.9,<5",
    "httpx2[http2,brotli,zstd]>=2.12,<3",
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
]

[project.scripts]
dib = "domain_intelligence.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D100",
    "D101",
    "D103",
    "D104",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TC001",
    "TC003",
    "TD002",
    "TD003",
    "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "PLR0913", "PLR0917", "S603", "SLF001", "D"]
"src/domain_intelligence/io.py" = ["D105"]
"src/domain_intelligence/snapshot.py" = ["D107"]
"src/domain_intelligence/cli.py" = ["FBT003", "PLR0913", "PLR0917"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
