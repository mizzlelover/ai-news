name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir _site
          git archive --format=tar HEAD | tar -x -C _site
          find _site/feeds -type f \( -name "follow.opml" -o -name "*.private.opml" -o -name "private*.opml" \) -delete 2>/dev/null || true
          find _site/data -maxdepth 1 -type f -name "email-digest.json" -delete 2>/dev/null || true
          find _site -type f -name ".DS_Store" -delete
          if find _site/feeds -type f \( -name "follow.opml" -o -name "*.private.opml" -o -name "private*.opml" \) -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Private OPML must not be published"
            exit 1
          fi
          test ! -e _site/data/email-digest.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
