name: Private Intelligence Observatory Core

on:
  push:
    paths:
      - "packages/domain-intelligence/**"
      - "docs/DOMAIN_INTELLIGENCE_V0_1.md"
      - "docs/SOURCE_PORTFOLIO_SCALE.md"
      - "docs/examples/**"
      - "docs/PRIVATE_INTELLIGENCE_FOR_PRACTITIONERS.md"
      - "DESIGN.md"
      - "demo/**"
      - "skills/domain-intelligence-bootstrap/**"
      - ".github/workflows/domain-intelligence.yml"
  pull_request:
    paths:
      - "packages/domain-intelligence/**"
      - "docs/DOMAIN_INTELLIGENCE_V0_1.md"
      - "docs/SOURCE_PORTFOLIO_SCALE.md"
      - "docs/examples/**"
      - "docs/PRIVATE_INTELLIGENCE_FOR_PRACTITIONERS.md"
      - "DESIGN.md"
      - "demo/**"
      - "skills/domain-intelligence-bootstrap/**"
      - ".github/workflows/domain-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/domain-intelligence
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate practitioner demo
        working-directory: .
        run: |
          node --check demo/app.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class DemoParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = ""
                  self.refs = []
                  self.in_title = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "title":
                      self.in_title = True
                  if tag in {"img", "script", "link"}:
                      for key in ("src", "href"):
                          if attrs.get(key):
                              self.refs.append(attrs[key])

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title += data

          html = Path("demo/index.html")
          parser = DemoParser()
          parser.feed(html.read_text())
          assert "私人情报所" in html.read_text()
          assert "私人情报所" in parser.title
          for ref in parser.refs:
              if ref.startswith(("http://", "https://", "#", "data:")):
                  continue
              assert (html.parent / ref).exists(), ref
          print("practitioner demo references are valid")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run --locked --group dev pytest -q

      - name: Run scaled Digital Twin fixture
        working-directory: .
        run: |
          uv run --locked --project packages/domain-intelligence dib \
            packages/domain-intelligence/examples/digital-twin-expanded.json \
            --output-dir /tmp/private-intelligence-digital-twin-ci
          python - <<'PY'
          import json
          from pathlib import Path

          bundle = json.loads(Path("packages/domain-intelligence/examples/digital-twin-expanded.json").read_text())
          report = json.loads(Path("/tmp/private-intelligence-digital-twin-ci/bootstrap-report.json").read_text())
          assert len(bundle["attention_graph"]["sources"]) == 117
          assert len(bundle["attention_graph"]["edges"]) == 117
          assert len(report["attention_recommendations"]) == 117
          assert len(report["portfolio"]["selected_source_ids"]) == 24
          assert len(report["brief"]["stories"]) == 7
          print("scaled Digital Twin fixture passed: 117 radar entries, 24 portfolio entries")
          PY

      - name: Check formatting
        run: uv run --locked --group dev ruff format --check src tests

      - name: Check lint
        run: uv run --locked --group dev ruff check src tests
